[package]
name = "madar-upgrade-authority"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "MADAR Network — 2-of-3 committee-gated Root dispatch for runtime upgrades (D43/Governance decision, §13). No sudo, no single-key authority. Membership itself is governed by the same threshold via pallet_collective::SetMembersOrigin, upgradeable to full on-chain governance later without a re-architecture."
license = "Apache-2.0"
publish = false

[dependencies]
parity-scale-codec = { version = "3.6.12", features = ["derive"], default-features = false }
scale-info = { version = "2.11.3", features = ["derive"], default-features = false }
frame-system = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
frame-support = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }

[dev-dependencies]
sp-core = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sp-io = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
pallet-collective = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }

[lints.rust]
unsafe_code = "deny"

[features]
default = ["std"]
std = [
    "parity-scale-codec/std",
    "scale-info/std",
    "frame-system/std",
    "frame-support/std",
]
