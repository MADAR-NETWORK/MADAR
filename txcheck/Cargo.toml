[package]
name = "madar-txcheck"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Madar TxCheck — reads a Substrate / Polkadot SDK transaction before it is signed and explains, in plain words, what it will really do and whether it is risky. Signed verdicts; no keys ever involved."
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
frame-metadata = { version = "23", default-features = false, features = ["current", "decode", "std"] }
scale-info = { version = "2.11", default-features = false, features = ["std", "decode"] }
parity-scale-codec = { version = "3", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
getrandom = "0.2"
blake2 = "0.10"
bs58 = "0.5"
hex = "0.4"

[lints.rust]
unsafe_code = "deny"
