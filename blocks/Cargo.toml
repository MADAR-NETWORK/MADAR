[package]
name = "madar-blocks"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "MADAR Network — Blocks phase: concrete (placeholder, not final — D24) BlockWeights/BlockLength wired into frame_system, so the size limits are actually load-bearing rather than sitting unused."
license = "Apache-2.0"
publish = false

[dependencies]
parity-scale-codec = { version = "3.6.12", features = ["derive"], default-features = false }
scale-info = { version = "2.11.3", features = ["derive"], default-features = false }
frame-system = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
frame-support = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }

[dev-dependencies]
sp-core = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sp-io = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
madar-identity = { path = "../identity" }
madar-transactions = { path = "../transactions" }

[lints.rust]
unsafe_code = "deny"

[features]
default = ["std"]
std = [
    "parity-scale-codec/std",
    "scale-info/std",
    "frame-system/std",
    "frame-support/std",
    "sp-runtime/std",
]
