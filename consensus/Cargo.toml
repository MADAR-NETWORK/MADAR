[package]
name = "madar-consensus"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "MADAR Network — Consensus phase: SessionKeys (BABE sr25519 + GRANDPA ed25519) and unmodified pallet-babe/pallet-grandpa/pallet-session wiring. No internal changes to BABE/GRANDPA (§2); SessionManager/equivocation reporting are reserved interfaces for the Admission/Sybil phase."
license = "Apache-2.0"
publish = false

[dependencies]
parity-scale-codec = { version = "3.6.12", features = ["derive"], default-features = false }
scale-info = { version = "2.11.3", features = ["derive"], default-features = false }
sp-core = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
sp-consensus-babe = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
sp-consensus-grandpa = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
frame-system = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
frame-support = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
pallet-babe = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
pallet-balances = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
pallet-grandpa = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
pallet-session = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false, features = ["historical"] }
pallet-authorship = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
sp-staking = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
pallet-timestamp = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
pallet-collective = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
madar-admission = { path = "../admission", default-features = false }
madar-admission-api = { path = "../admission-api", default-features = false }
madar-upgrade-authority = { path = "../upgrade-authority", default-features = false }
madar-stamp = { path = "../stamp", default-features = false }
madar-names = { path = "../names", default-features = false }
madar-protocol = { path = "../protocol", default-features = false }
madar-identity = { path = "../identity", default-features = false }
madar-transactions = { path = "../transactions", default-features = false }
madar-blocks = { path = "../blocks", default-features = false }
sp-api = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
sp-block-builder = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
sp-transaction-pool = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
sp-offchain = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
sp-version = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
sp-genesis-builder = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
sp-session = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
sp-inherents = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
frame-executive = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
frame-system-rpc-runtime-api = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
sp-keyring = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
finality-grandpa = { version = "0.16", features = ["derive-codec"] }
sp-io = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }

[build-dependencies]
substrate-wasm-builder = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", optional = true }

[lints.rust]
unsafe_code = "deny"

[features]
## Isolated live tests only (short epoch, short membership term, lower difficulty, test genesis). Forbidden in any production build.
fast-test-runtime = []
## Builds a WASM with spec=4 (and a membership term of 5 instead of 4 with fast-test-runtime) for live upgrade testing only.
upgrade-fixture = []
default = ["std"]
std = [
    "parity-scale-codec/std",
    "scale-info/std",
    "sp-core/std",
    "sp-runtime/std",
    "sp-consensus-babe/std",
    "sp-consensus-grandpa/std",
    "frame-system/std",
    "frame-support/std",
    "pallet-babe/std",
    "pallet-balances/std",
    "pallet-grandpa/std",
    "pallet-session/std",
    "pallet-authorship/std",
    "sp-staking/std",
    "pallet-timestamp/std",
    "pallet-collective/std",
    "madar-admission/std",
    "madar-admission-api/std",
    "madar-blocks/std",
    "madar-upgrade-authority/std",
    "madar-stamp/std",
    "madar-names/std",
    "madar-protocol/std",
    "madar-identity/std",
    "madar-transactions/std",
    "sp-api/std",
    "sp-block-builder/std",
    "sp-transaction-pool/std",
    "sp-offchain/std",
    "sp-version/std",
    "sp-genesis-builder/std",
    "sp-session/std",
    "sp-inherents/std",
    "frame-executive/std",
    "frame-system-rpc-runtime-api/std",
    "sp-keyring/std",
    "serde_json/std",
    "substrate-wasm-builder",
]
