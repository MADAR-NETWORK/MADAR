# This template contains all of the possible sections and their default values

# Note that all fields that take a lint level have these possible values:
# * deny - An error will be produced and the check will fail
# * warn - A warning will be produced, but the check will not fail
# * allow - No warning or error will be produced, though in some cases a note
# will be

# The values provided in this template are the default values that will be used
# when any section or field is not specified in your own configuration

# Root options

# The graph table configures how the dependency graph is constructed and thus
# which crates the checks are performed against
[graph]
# If 1 or more target triples (and optionally, target_features) are specified,
# only the specified targets will be checked when running `cargo deny check`.
# This means, if a particular package is only ever used as a target specific
# dependency, such as, for example, the `nix` crate only being used via the
# `target_family = "unix"` configuration, that only having windows targets in
# this list would mean the nix crate, as well as any of its exclusive
# dependencies not shared by any other crates, would be ignored, as the target
# list here is effectively saying which targets you are building for.
targets = [
    # The triple can be any string, but only the target triples built in to
    # rustc (as of 1.40) can be checked against actual config expressions
    #"x86_64-unknown-linux-musl",
    # You can also specify which target_features you promise are enabled for a
    # particular target. target_features are currently not validated against
    # the actual valid features supported by the target architecture.
    #{ triple = "wasm32-unknown-unknown", features = ["atomics"] },
]
# When creating the dependency graph used as the source of truth when checks are
# executed, this field can be used to prune crates from the graph, removing them
# from the view of cargo-deny. This is an extremely heavy hammer, as if a crate
# is pruned from the graph, all of its dependencies will also be pruned unless
# they are connected to another crate in the graph that hasn't been pruned,
# so it should be used with care. The identifiers are [Package ID Specifications]
# (https://doc.rust-lang.org/cargo/reference/pkgid-spec.html)
#exclude = []
# If true, metadata will be collected with `--all-features`. Note that this can't
# be toggled off if true, if you want to conditionally enable `--all-features` it
# is recommended to pass `--all-features` on the cmd line instead
all-features = false
# If true, metadata will be collected with `--no-default-features`. The same
# caveat with `all-features` applies
no-default-features = false
# If set, these feature will be enabled when collecting metadata. If `--features`
# is specified on the cmd line they will take precedence over this option.
#features = []

# The output table provides options for how/if diagnostics are outputted
[output]
# When outputting inclusion graphs in diagnostics that include features, this
# option can be used to specify the depth at which feature edges will be added.
# This option is included since the graphs can be quite large and the addition
# of features from the crate(s) to all of the graph roots can be far too verbose.
# This option can be overridden via `--feature-depth` on the cmd line
feature-depth = 1

# This section is considered when running `cargo deny check advisories`
# More documentation for the advisories section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
# The path where the advisory databases are cloned/fetched into
#db-path = "$CARGO_HOME/advisory-dbs"
# The url(s) of the advisory databases to use
#db-urls = ["https://github.com/rustsec/advisory-db"]

# Dependency exception policy (approved 2026-09-17) — see
# docs/security/dependency-exceptions.md for the full details, conditions and review
# cycle. The rule: "all" stays the strictest default — any new unmaintained package
# not listed below by name fails the gate immediately as usual. We never widen this
# scope to anything broader (such as "workspace"), so future packages cannot disappear silently.
unmaintained = "all"

# A list of advisory IDs to ignore. Note that ignored advisories will still
# output a note when they are encountered.
#
# Every entry below is a Tier-2 exception fully documented in
# docs/security/dependency-exceptions.md (no Tier-1/vulnerability at all —
# cargo-deny itself does not allow relaxing those). Every exception has a mandatory next review
# date recorded there; this list is never extended silently without updating that file
# first and without the project owner's explicit approval.
ignore = [
    { id = "RUSTSEC-2025-0161", reason = "libsecp256k1 0.7.2 — unmaintained (not a vulnerability). Transitive dependency forced by sp-core (polkadot-sdk, tag polkadot-stable2606-2). No safe upgrade available even in polkadot-stable2606 (latest production release). See docs/security/dependency-exceptions.md #1; next review: 2026-12-17, a new SDK release or a Cargo.lock change." },
    { id = "RUSTSEC-2022-0061", reason = "parity-wasm 0.45.0 — unmaintained (not a vulnerability). Transitive dependency forced by sp-version (polkadot-sdk, tag polkadot-stable2606-2). No safe upgrade available even in polkadot-stable2606. See docs/security/dependency-exceptions.md #2; next review: 2026-12-17, a new SDK release or a Cargo.lock change." },
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 — unmaintained (not a vulnerability). Transitive dependency forced by frame-support/sp-core (polkadot-sdk, tag polkadot-stable2606-2). No safe upgrade available even in polkadot-stable2606. See docs/security/dependency-exceptions.md #3; next review: 2026-12-17, a new SDK release or a Cargo.lock change." },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 — unmaintained (not a vulnerability). Transitive dependency forced by aquamarine<-frame-support (polkadot-sdk, tag polkadot-stable2606-2). No safe upgrade available even in polkadot-stable2606. See docs/security/dependency-exceptions.md #4; next review: 2026-12-17, a new SDK release or a Cargo.lock change." },
    { id = "RUSTSEC-2025-0057", reason = "fxhash 0.2.1 — unmaintained only (not a vulnerability). Forced by polkadot-sdk (wasmtime profiling <- fxprof-processed-profile <- fxhash; compiled but never executed). Version 0.2.1 only: enforced by scripts/verify-build-env.sh (fails if the locked version changes). Temporary: removed as soon as the dependency disappears after an SDK update. Approved 2026-09-19, review: 2026-12-17 or a new stableYYMM. See docs/security/dependency-exceptions.md #5." },
    { id = "RUSTSEC-2024-0384", reason = "instant 0.1.13 — unmaintained only (not a vulnerability). Forced by polkadot-sdk (sc-network <- wasm-timer <- parking_lot 0.11 <- instant; an alias for std::time::Instant). Version 0.1.13 only: enforced by scripts/verify-build-env.sh (fails if the locked version changes). Temporary: removed as soon as the dependency disappears after an SDK update. Approved 2026-09-19, review: 2026-12-17 or a new stableYYMM. See docs/security/dependency-exceptions.md #6." },
]
# If this is true, then cargo deny will use the git executable to fetch advisory database.
# If this is false, then it uses a built-in git library.
# Setting this to true can be helpful if you have special authentication requirements that cargo-deny does not support.
# See Git Authentication for more information about setting up git authentication.
#git-fetch-with-cli = true

# This section is considered when running `cargo deny check licenses`
# More documentation for the licenses section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
# [possible values: any SPDX 3.11 short identifier (+ optional exception)].
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "0BSD",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "ISC", # standard permissive (ring, rustls-webpki, untrusted…)
]
# The confidence threshold for detecting a license from license text.
# The higher the value, the more closely the license text must be to the
# canonical license text of a valid SPDX license file.
# [possible values: any between 0.0 and 1.0].
confidence-threshold = 0.8
# Allow 1 or more licenses on a per-crate basis, so that particular licenses
# aren't accepted for every possible crate as with the normal allow list
exceptions = [
    # Each entry is the crate and version constraint, and its specific allow
    # list
    #{ allow = ["Zlib"], crate = "adler32" },
    # `option-ext` (MPL-2.0) — a transitive dependency through [build-dependencies] only
    # (substrate-wasm-builder -> polkavm-linker -> dirs -> dirs-sys -> option-ext),
    # a host build tool that is never shipped or linked into any binary or
    # WASM Runtime we produce — MPL-2.0 is a weak file-level copyleft license
    # that imposes no obligation on our code. See D40/D41.
    { allow = ["MPL-2.0"], crate = "option-ext" },
    # `webpki-roots` 0.25.4 (MPL-2.0, a copy of the root certificates; via libp2p-websocket in a libp2p backend that is rejected at startup): file-level copyleft; we do not modify it and it imposes no obligation on our code.
    { allow = ["MPL-2.0"], crate = "webpki-roots" },
    # The `sc-*` client components of polkadot-sdk: GPL-3.0-or-later WITH Classpath-exception-2.0 — their original license, with no alternative Substrate client; documented and approved in
    # docs/security/node-licensing.md (D42): our code stays Apache-2.0 thanks to the exception. Restricted by package name (the license is not added to the global allow list).
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-basic-authorship" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-block-builder" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-chain-spec" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-chain-spec-derive" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-cli" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-client-api" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-client-db" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-consensus" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-consensus-babe" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-consensus-epochs" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-consensus-grandpa" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-consensus-slots" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-executor" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-executor-common" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-executor-polkavm" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-executor-wasmtime" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-informant" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-keystore" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-mixnet" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-network" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-network-common" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-network-gossip" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-network-light" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-network-statement" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-network-sync" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-network-transactions" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-network-types" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-offchain" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-proposer-metrics" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-rpc" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-rpc-api" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-rpc-server" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-rpc-spec-v2" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-service" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-state-db" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-statement-store" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-sysinfo" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-telemetry" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-tracing" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-transaction-pool" },
    { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "sc-transaction-pool-api" },
]

# Clarify for `array-bytes` — a transitive dependency via `sp-core`/`frame-support`
# (polkadot-sdk). The `license` field in its `Cargo.toml` uses an old, deprecated
# slash SPDX syntax ("Apache-2.0/GPL-3.0") that the current cargo-deny parser
# does not accept (a parse error, not a policy rejection). The package is actually licensed
# under two separate alternative licenses (dual license; separate LICENSE-APACHE2/LICENSE-GPL3 files
# in its source) — we state the correct syntax (`OR`) explicitly here instead of waiting
# for the publisher to fix its classification; Apache-2.0 (already in the allow list above) is
# the license we actually use of the two.
[[licenses.clarify]]
crate = "array-bytes"
expression = "Apache-2.0 OR GPL-3.0-only"
license-files = [
    { path = "LICENSE-APACHE2", hash = 0xff35a0c9 },
]

[licenses.private]
# If true, ignores workspace crates that aren't published, or are only
# published to private registries.
# To see how to mark a crate as unpublished (to the official registry),
# visit https://doc.rust-lang.org/cargo/reference/manifest.html#the-publish-field.
ignore = false
# One or more private registries that you might publish crates to, if a crate
# is only published to private registries, and ignore is true, the crate will
# not have its license(s) checked
registries = [
    #"https://sekretz.com/registry
]

# This section is considered when running `cargo deny check bans`.
# More documentation about the 'bans' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"
# Lint level for when a crate version requirement is `*`
wildcards = "allow"
# The graph highlighting used when creating dotgraphs for crates
# with multiple versions
# * lowest-version - The path to the lowest versioned duplicate is highlighted
# * simplest-path - The path to the version with the fewest edges is highlighted
# * all - Both lowest-version and simplest-path are used
highlight = "all"
# The default lint level for `default` features for crates that are members of
# the workspace that is being checked. This can be overridden by allowing/denying
# `default` on a crate-by-crate basis if desired.
workspace-default-features = "allow"
# The default lint level for `default` features for external crates that are not
# members of the workspace. This can be overridden by allowing/denying `default`
# on a crate-by-crate basis if desired.
external-default-features = "allow"
# List of crates that are allowed. Use with care!
allow = [
    #"ansi_term@0.11.0",
    #{ crate = "ansi_term@0.11.0", reason = "you can specify a reason it is allowed" },
]
# If true, workspace members are automatically allowed even when using deny-by-default
# This is useful for organizations that want to deny all external dependencies by default
# but allow their own workspace crates without having to explicitly list them
allow-workspace = false
# List of crates to deny
deny = [
    #"ansi_term@0.11.0",
    #{ crate = "ansi_term@0.11.0", reason = "you can specify a reason it is banned" },
    # Wrapper crates can optionally be specified to allow the crate when it
    # is a direct dependency of the otherwise banned crate
    #{ crate = "ansi_term@0.11.0", wrappers = ["this-crate-directly-depends-on-ansi_term"] },
]

# List of features to allow/deny
# Each entry the name of a crate and a version range. If version is
# not specified, all versions will be matched.
#[[bans.features]]
#crate = "reqwest"
# Features to not allow
#deny = ["json"]
# Features to allow
#allow = [
#    "rustls",
#    "__rustls",
#    "__tls",
#    "hyper-rustls",
#    "rustls",
#    "rustls-pemfile",
#    "rustls-tls-webpki-roots",
#    "tokio-rustls",
#    "webpki-roots",
#]
# If true, the allowed features must exactly match the enabled feature set. If
# this is set there is no point setting `deny`
#exact = true

# Certain crates/versions that will be skipped when doing duplicate detection.
skip = [
    #"ansi_term@0.11.0",
    #{ crate = "ansi_term@0.11.0", reason = "you can specify a reason why it can't be updated/removed" },
]
# Similarly to `skip` allows you to skip certain crates during duplicate
# detection. Unlike skip, it also includes the entire tree of transitive
# dependencies starting at the specified crate, up to a certain depth, which is
# by default infinite.
skip-tree = [
    #"ansi_term@0.11.0", # will be skipped along with _all_ of its direct and transitive dependencies
    #{ crate = "ansi_term@0.11.0", depth = 20 },
]

# This section is considered when running `cargo deny check sources`.
# More documentation about the 'sources' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
[sources]
# Lint level for what to happen when a crate from a crate registry that is not
# in the allow list is encountered
unknown-registry = "deny"
# Lint level for what to happen when a crate from a git repository that is not
# in the allow list is encountered
unknown-git = "deny"
# List of URLs for allowed crate registries. Defaults to the crates.io index
# if not specified. If it is specified but empty, no registries are allowed.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# List of URLs for allowed Git repositories
allow-git = ["https://github.com/paritytech/polkadot-sdk.git"]

[sources.allow-org]
# github.com organizations to allow git sources for
github = []
# gitlab.com organizations to allow git sources for
gitlab = []
# bitbucket.org organizations to allow git sources for
bitbucket = []
