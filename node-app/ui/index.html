<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<title>MADAR Node</title>
<style>
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --surface-2:#F0F3FA; --border:#E3E8F2; --ink:#0E1528; --mute:#5B6784;
  --brand-a:#0FB5A6; --brand-b:#2F5BEA; --accent:#FFC53D;
  --good:#16A34A; --warn:#D97706; --bad:#DC2626; --idle:#94A3B8;
  --shadow:0 1px 2px rgba(14,21,40,.05),0 8px 24px rgba(14,21,40,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B1020; --surface:#121935; --surface-2:#18213F; --border:#243052; --ink:#E7ECF7; --mute:#8D98B5;
  --good:#22C55E; --warn:#F5A524; --bad:#EF4444; --idle:#64748B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 48px}

/* header */
header{display:flex;align-items:center;gap:12px;margin:4px 0 22px}
header img{width:44px;height:44px;border-radius:50%;flex:none;box-shadow:0 0 18px rgba(29,78,216,.35)}
.brand{flex:1;min-width:0}
.brand h1{font-size:19px;margin:0;letter-spacing:.2px}
.brand p{margin:0;color:var(--mute);font-size:13px}
.lang{appearance:none;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:7px 30px 7px 12px;font:inherit;font-size:13px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}

/* update bar */
.update-bar{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#1d4fd8,#3d7bff);color:#fff;padding:12px 16px;box-shadow:var(--shadow)}
.update-bar .in{max-width:680px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.update-bar b{font-size:15px}
.update-bar .sub{opacity:.92;font-size:13px}
.update-bar button{background:#fff;color:#1d4fd8;border:0;font-weight:700}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:14px;margin:0 0 14px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.6px}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.ring{position:relative;width:148px;height:148px}
.ring svg{width:148px;height:148px;transform:rotate(-90deg)}
.ring .track{stroke:var(--surface-2)}
.ring .arc{stroke:var(--idle);transition:stroke-dashoffset .8s ease,stroke .3s}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.ring .small{font-size:12px;color:var(--mute)}
.ring .dot{width:14px;height:14px;border-radius:50%;background:var(--idle);box-shadow:0 0 0 6px color-mix(in srgb,var(--idle) 18%,transparent)}
.hero .state{font-size:22px;font-weight:700;margin:0 0 4px}
.hero .sentence{color:var(--mute);margin:0 0 10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px 10px}
.s-running{--c:var(--good)} .s-catching_up,.s-connecting,.s-starting,.s-bootstrapping{--c:var(--warn)} .s-disconnected,.s-needs_repair{--c:var(--bad)} .s-stopped,.s-needs_account,.s-paused{--c:var(--idle)}
.hero .arc{stroke:var(--c)} .hero .dot{background:var(--c);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 20%,transparent)}
.s-running .dot{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 11px color-mix(in srgb,var(--c) 6%,transparent)}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat span{display:block;color:var(--mute);font-size:12px}
.stat b{font-size:18px;font-variant-numeric:tabular-nums}

/* forms */
label.fld{display:block;font-weight:600;margin:14px 0 6px;font-size:14px}
input[type=text],input[type=email]{width:100%;padding:11px 13px;font:inherit;border:1px solid var(--border);border-radius:11px;background:var(--surface-2);color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--brand-b);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-b) 20%,transparent)}
input[type=email]{direction:ltr}
.hint{color:var(--mute);font-size:13px;margin:6px 0 0}
.note{background:var(--surface-2);border-radius:12px;padding:10px 12px;margin-top:14px;font-size:13px;color:var(--mute)}
.note b{color:var(--ink)}
button{font:inherit;font-weight:600;padding:10px 18px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;transition:transform .05s,filter .2s}
button:active{transform:translateY(1px)}
button.primary{background:linear-gradient(135deg,var(--brand-a),var(--brand-b));border:0;color:#fff;margin-top:18px;width:100%;padding:12px}
button.primary:disabled{filter:grayscale(.6) opacity(.55);cursor:default}
button.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--border))}
.err{color:var(--bad);min-height:1.4em;margin-top:8px;font-size:13px}

dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0}
dt{color:var(--mute)} dd{margin:0;overflow-wrap:anywhere}
.lock{font-size:12px;color:var(--mute);font-weight:400;text-transform:none;letter-spacing:0}

.row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;transition:.2s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:20px;height:20px;top:2px;inset-inline-start:2px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch input:checked+span{background:linear-gradient(135deg,var(--brand-a),var(--brand-b));border-color:transparent}
.switch input:checked+span:before{transform:translateX(20px)}
.setting b{display:block} .setting small{color:var(--mute)}

footer{color:var(--mute);font-size:12px;text-align:center;margin-top:18px}
.eta{font-size:13px;color:var(--warn);font-weight:600;margin:-4px 0 10px}
.stats{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))!important}
.warns{margin-top:14px;display:grid;gap:8px}
.warn{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--border));border-radius:12px;padding:10px 12px;font-size:13px}
.warn:before{content:"!";flex:none;width:20px;height:20px;border-radius:50%;background:var(--warn);color:#fff;font-weight:700;display:grid;place-items:center;font-size:12px}
.repair{border-color:color-mix(in srgb,var(--bad) 45%,var(--border))}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chart{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.chart .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.chart .lbl b{color:var(--ink);font-size:14px}
.chart svg{width:100%;height:54px;display:block;margin-top:6px}
.welcome{text-align:center;padding:30px 26px}
.welcome img{width:84px;height:84px;border-radius:22px;margin:0 auto 14px;display:block;box-shadow:0 10px 30px color-mix(in srgb,var(--brand-b) 35%,transparent)}
.welcome h2{font-size:22px!important;color:var(--ink)!important;text-transform:none!important;letter-spacing:0!important;margin:0 0 8px!important}
.welcome p{color:var(--mute);max-width:440px;margin:0 auto 20px}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--border)} .dots i.on{background:var(--brand-b);width:22px;border-radius:4px}
.welcome .primary{max-width:260px}
@media (max-width:560px){.charts{grid-template-columns:1fr}}
[hidden]{display:none!important}
@media (max-width:560px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.stats{grid-template-columns:repeat(2,1fr)}
  header{flex-wrap:wrap}.brand{flex:1 1 calc(100% - 60px)}.lang{margin-inline-start:52px}}
</style>
</head>
<body>
<div class="update-bar" id="update-bar" role="alert" hidden>
  <div class="in">
    <div><b id="upd-title"></b><div class="sub" id="upd-text"></div></div>
    <button id="upd-btn" data-t="upd_btn"></button>
  </div>
</div>

<div class="wrap">
  <header>
    <img src="/logo.svg" alt="">
    <div class="brand"><h1 data-t="app_title"></h1><p data-t="tagline"></p></div>
    <select class="lang" id="lang" aria-label="Language">
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
      <option value="tr">Türkçe</option>
      <option value="id">Bahasa Indonesia</option>
    </select>
  </header>

  <!-- welcome (first run) -->
  <section class="card welcome" id="welcome" hidden>
    <img src="/logo.svg" alt="">
    <div class="dots" id="w-dots"><i></i><i></i><i></i></div>
    <h2 id="w-title"></h2>
    <p id="w-text"></p>
    <button class="primary" id="w-next"></button>
  </section>

  <!-- status -->
  <section class="card" id="hero-card" hidden>
    <div class="hero s-starting" id="hero">
      <div class="ring">
        <svg viewBox="0 0 160 160"><circle class="track" cx="80" cy="80" r="68" fill="none" stroke-width="12"/>
          <circle class="arc" id="arc" cx="80" cy="80" r="68" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="427.3" stroke-dashoffset="427.3"/></svg>
        <div class="center"><div class="big" id="ring-big"></div><div class="small" id="ring-small"></div><div class="dot" id="ring-dot" hidden></div></div>
      </div>
      <div>
        <p class="state" id="state"></p>
        <p class="sentence" id="sentence"></p>
        <p class="eta" id="eta" hidden></p>
        <span class="chip" data-t="role"></span>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span data-t="stat_best"></span><b id="best">—</b></div>
      <div class="stat"><span data-t="stat_final"></span><b id="fin">—</b></div>
      <div class="stat"><span data-t="stat_peers"></span><b id="peers">—</b></div>
      <div class="stat"><span data-t="stat_uptime"></span><b id="uptime">—</b></div>
      <div class="stat"><span data-t="stat_verified"></span><b id="verified">—</b></div>
    </div>
    <div class="warns" id="warns"></div>
  </section>

  <section class="card repair" id="repair-card" hidden>
    <div class="row">
      <div class="setting"><b data-t="st_needs_repair"></b><small data-t="repair_hint"></small></div>
      <button class="danger" id="repair-btn" data-t="repair_btn"></button>
    </div>
  </section>

  <section class="card" id="chart-card" hidden>
    <h2 data-t="chart_title"></h2>
    <div class="charts">
      <div class="chart"><div class="lbl"><span data-t="chart_blocks"></span><b id="c-bpm">—</b></div><svg id="c-blocks" viewBox="0 0 200 54" preserveAspectRatio="none"></svg></div>
      <div class="chart"><div class="lbl"><span data-t="chart_peers"></span><b id="c-peers-now">—</b></div><svg id="c-peers" viewBox="0 0 200 54" preserveAspectRatio="none"></svg></div>
    </div>
    <p class="hint" id="chart-empty" data-t="chart_empty"></p>
  </section>

  <!-- account: form, then locked view -->
  <section class="card" id="acc-form" hidden>
    <h2 data-t="account_title"></h2>
    <label class="fld" for="name" data-t="name_label"></label>
    <input id="name" type="text" maxlength="20" autocomplete="nickname">
    <p class="hint" data-t="name_hint"></p>
    <label class="fld" for="email" data-t="email_label"></label>
    <input id="email" type="email" maxlength="254" autocomplete="email" placeholder="name@example.com">
    <div class="note"><span data-t="privacy_note"></span><br><b data-t="lock_note"></b></div>
    <button class="primary" id="acc-btn" data-t="save_btn" disabled></button>
    <div class="err" id="acc-err"></div>
  </section>

  <section class="card" id="acc-view" hidden>
    <h2><span data-t="account_title"></span> <span class="lock">· <span data-t="locked"></span></span></h2>
    <dl>
      <dt data-t="name_label"></dt><dd id="acc-name"></dd>
      <dt data-t="email_label"></dt><dd id="acc-email" dir="ltr"></dd>
      <dt data-t="registry"></dt><dd id="acc-reg"></dd>
    </dl>
  </section>

  <section class="card" id="settings" hidden>
    <h2 data-t="settings_title"></h2>
    <div class="row">
      <div class="setting"><b data-t="autostart"></b><small data-t="autostart_hint"></small></div>
      <label class="switch"><input type="checkbox" id="autostart"><span></span></label>
    </div>
    <div class="row" style="margin-top:14px">
      <div class="setting"><b data-t="saver"></b><small data-t="saver_hint"></small></div>
      <label class="switch"><input type="checkbox" id="saver"><span></span></label>
    </div>
    <div class="row" style="margin-top:14px">
      <div class="setting"><b data-t="help_title"></b><small data-t="help_hint"></small></div>
      <label class="switch"><input type="checkbox" id="help-net"><span></span></label>
    </div>
    <div class="row" style="margin-top:14px">
      <div class="setting"><b data-t="report_title"></b><small data-t="report_hint"></small></div>
      <button id="report-btn" data-t="report_btn"></button>
    </div>
    <div class="row" style="margin-top:18px">
      <small class="hint" data-t="close_hint"></small>
      <button class="danger" id="stop-btn" data-t="stop_btn"></button>
    </div>
  </section>

  <section class="card" id="off" hidden>
    <div class="hero s-stopped">
      <div class="ring"><svg viewBox="0 0 160 160"><circle class="track" cx="80" cy="80" r="68" fill="none" stroke-width="12"/></svg>
        <div class="center"><div class="dot"></div></div></div>
      <div><p class="state" id="off-title"></p><p class="sentence" id="off-hint"></p></div>
    </div>
  </section>

  <footer id="foot"></footer>
</div>

Object.assign(I18N.id, {help_title:"Bantu jaringan",help_hint:"Izinkan node lain terhubung ke node Anda agar jaringan lebih kuat. Windows mungkin meminta izin firewall untuk MADAR. Node dimulai ulang untuk menerapkannya.",report_title:"Laporan masalah",report_hint:"Membuat berkas berisi log teknis (tanpa email, akun, kunci, atau alamat IP) dan membuka email ke dukungan MADAR.",report_btn:"Kirim laporan masalah",report_done:"Berkas laporan telah dibuat:\n{v}\n\nLampirkan ke email yang baru terbuka lalu kirim.",e_report_failed:"Laporan tidak dapat dibuat."});
let LANG = "en", stopped = false, updating = false, built = false, lastStatus = null;

const t = (k, v) => ((I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k).replace("{v}", v ?? "");
const nf = n => n == null ? "—" : new Intl.NumberFormat(LANG).format(n);

function applyLang(lang) {
  LANG = I18N[lang] ? lang : "en";
  document.documentElement.lang = LANG;
  document.documentElement.dir = "ltr";
  $("lang").value = LANG;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.title = t("app_title");
  if (lastStatus) render(lastStatus);
}

async function post(path, body) {
  const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json", "X-Madar-Token": TOKEN}, body: JSON.stringify(body || {})});
  let j = {}; try { j = await r.json(); } catch (e) {}
  return {ok: r.ok, j};
}

$("lang").addEventListener("change", async e => { applyLang(e.target.value); try { await post("/api/settings", {lang: LANG}); } catch (_) {} });
$("autostart").addEventListener("change", async e => {
  const {ok, j} = await post("/api/settings", {autostart: e.target.checked});
  if (!ok) { e.target.checked = !e.target.checked; alert(t("e_" + (j.error || "generic"))); }
});

function validate() {
  const n = $("name").value.trim().length, em = $("email").value.trim();
  $("acc-btn").disabled = !(n >= 3 && n <= 20 && /^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/.test(em));
}
$("name").addEventListener("input", validate);
$("email").addEventListener("input", validate);
$("acc-btn").addEventListener("click", async () => {
  if (!confirm(t("confirm_save"))) return;
  $("acc-btn").disabled = true; $("acc-err").textContent = "";
  const {ok, j} = await post("/api/account", {name: $("name").value, email: $("email").value});
  if (!ok) { $("acc-err").textContent = t("e_" + (j.error || "generic")); validate(); return; }
  refresh();
});
$("stop-btn").addEventListener("click", async () => {
  if (!confirm(t("confirm_stop"))) return;
  $("stop-btn").disabled = true;
  try { await post("/api/stop"); } catch (e) {}
  stopped = true; showOff("off_title", "off_hint");
});
$("upd-btn").addEventListener("click", async () => {
  $("upd-btn").disabled = true;
  const {ok, j} = await post("/api/update");
  if (!ok) { $("upd-text").textContent = t("e_" + (j.error || "generic")); $("upd-btn").disabled = false; }
});

function showOff(title, hint) {
  ["hero-card", "acc-form", "acc-view", "settings"].forEach(s => $(s).hidden = true);
  $("off").hidden = false; $("off-title").textContent = t(title); $("off-hint").textContent = t(hint);
}

// ===== welcome (first run) =====
let wStep = 0;
function renderWelcome() {
  const n = wStep + 1;
  $("w-title").textContent = t("w" + n + "_title");
  $("w-text").textContent = t("w" + n + "_text");
  $("w-next").textContent = n < 3 ? t("next") : t("get_started");
  [...$("w-dots").children].forEach((d, i) => d.classList.toggle("on", i === wStep));
}
$("w-next").addEventListener("click", async () => {
  if (wStep < 2) { wStep++; renderWelcome(); return; }
  $("w-next").disabled = true;
  try { await post("/api/settings", {onboarded: true}); } catch (_) {}
  $("w-next").disabled = false;
  refresh();
});

// ===== ETA from recent progress =====
const syncSamples = [];
function estimateEta(sync) {
  const now = Date.now();
  syncSamples.push([now, sync.current]);
  while (syncSamples.length > 2 && now - syncSamples[0][0] > 60000) syncSamples.shift();
  if (syncSamples.length < 2) return null;
  const [t0, c0] = syncSamples[0];
  const rate = (sync.current - c0) / ((now - t0) / 1000);
  const left = sync.highest - sync.current;
  return rate > 0 && left > 0 ? left / rate : null;
}

// ===== sparklines (last hour, samples every 30 s from the app) =====
function sparkline(svg, values, color) {
  if (values.length < 2) { svg.replaceChildren(); return; }
  const max = Math.max(1, ...values), W = 200, H = 54, pad = 3;
  const pts = values.map((v, i) => [i * (W / (values.length - 1)), H - pad - (v / max) * (H - 2 * pad)]);
  const line = pts.map(([x, y], i) => (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1)).join(" ");
  const ns = "http://www.w3.org/2000/svg";
  const area = document.createElementNS(ns, "path");
  area.setAttribute("d", line + ` L${W} ${H} L0 ${H} Z`); area.setAttribute("fill", color); area.setAttribute("fill-opacity", ".12");
  const path = document.createElementNS(ns, "path");
  path.setAttribute("d", line); path.setAttribute("fill", "none"); path.setAttribute("stroke", color);
  path.setAttribute("stroke-width", "2"); path.setAttribute("vector-effect", "non-scaling-stroke"); path.setAttribute("stroke-linejoin", "round");
  svg.replaceChildren(area, path);
}
function renderCharts(hist) {
  const bpm = [];
  for (let i = 1; i < hist.length; i++) {
    const dt = (hist[i][0] - hist[i - 1][0]) / 60;
    bpm.push(dt > 0 ? Math.max(0, (hist[i][1] - hist[i - 1][1]) / dt) : 0);
  }
  const peers = hist.map(h => h[2]);
  const css = getComputedStyle(document.documentElement);
  sparkline($("c-blocks"), bpm, css.getPropertyValue("--brand-a").trim() || "#0FB5A6");
  sparkline($("c-peers"), peers, css.getPropertyValue("--brand-b").trim() || "#2F5BEA");
  $("c-bpm").textContent = bpm.length ? nf(Math.round(bpm[bpm.length - 1])) : "—";
  $("c-peers-now").textContent = peers.length ? nf(peers[peers.length - 1]) : "—";
  $("chart-empty").hidden = hist.length >= 2;
}

$("help-net").addEventListener("change", async e => {
  const {ok, j} = await post("/api/settings", {help_network: e.target.checked});
  if (!ok) { e.target.checked = !e.target.checked; alert(t("e_" + (j.error || "generic"))); }
});
$("report-btn").addEventListener("click", async () => {
  $("report-btn").disabled = true;
  const {ok, j} = await post("/api/report", {});
  $("report-btn").disabled = false;
  alert(ok ? t("report_done", j.file) : t("e_" + (j.error || "generic")));
});
$("saver").addEventListener("change", async e => {
  const {ok, j} = await post("/api/settings", {saver: e.target.checked});
  if (!ok) { e.target.checked = !e.target.checked; alert(t("e_" + (j.error || "generic"))); }
});
$("repair-btn").addEventListener("click", async () => {
  if (!confirm(t("confirm_repair"))) return;
  $("repair-btn").disabled = true;
  const {ok, j} = await post("/api/repair", {});
  $("repair-btn").disabled = false;
  if (!ok) alert(t("e_" + (j.error || "generic")));
  refresh();
});

function fmtUptime(s) {
  if (s == null) return "—";
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${nf(d)}${t("u_d")} ${nf(h)}${t("u_h")}` : h ? `${nf(h)}${t("u_h")} ${nf(m)}${t("u_m")}` : `${nf(m)}${t("u_m")}`;
}

const ARC = 427.3;
function renderHero(s) {
  const hero = $("hero");
  hero.className = "hero s-" + s.state;
  $("state").textContent = t("st_" + s.state);
  const sentenceKey = s.state === "paused" ? "se_paused_" + (s.paused || "battery")
    : s.state === "bootstrapping" ? "se_bootstrap_" + (s.bootstrap || "downloading") : "se_" + s.state;
  $("sentence").textContent = t(sentenceKey);
  // Time remaining: from the block progress rate over the last minute (computed in the page).
  const eta = s.state === "catching_up" && s.sync ? estimateEta(s.sync) : null;
  $("eta").hidden = eta == null;
  if (eta != null) $("eta").textContent = t("eta", eta < 60 ? `${nf(Math.max(1, Math.round(eta)))} ${t("u_sec")}` : `${nf(Math.ceil(eta / 60))} ${t("u_min")}`);
  $("verified").textContent = nf(s.blocks_verified);
  const warns = [];
  const h = s.health || {};
  if (h.disk_low) warns.push(t("warn_disk", nf(h.disk_free_gb)));
  if (h.clock_bad) warns.push(t("warn_clock", nf(Math.round(Math.abs(h.clock_offset_s)))));
  $("warns").replaceChildren(...warns.map(w => { const d = document.createElement("div"); d.className = "warn"; d.textContent = w; return d; }));
  const pct = s.sync ? Math.min(100, Math.max(0, s.sync.percent)) : null;
  let frac = 0, big = "", small = "", dot = false;
  if (s.state === "running") { frac = 1; big = "✓"; small = t("synced"); }
  else if (s.state === "catching_up" && pct != null) { frac = pct / 100; big = nf(Math.floor(pct)) + "%"; small = t("synced"); }
  else if (s.state === "connecting" || s.state === "starting" || s.state === "bootstrapping") { frac = .15; dot = true; }
  else if (s.state === "disconnected") { frac = pct != null ? pct / 100 : 1; dot = true; }
  else { dot = true; }
  $("arc").style.strokeDashoffset = String(ARC * (1 - frac));
  $("ring-big").textContent = big; $("ring-small").textContent = small;
  $("ring-dot").hidden = !dot; $("ring-big").hidden = dot; $("ring-small").hidden = dot;
  $("best").textContent = nf(s.best); $("fin").textContent = nf(s.finalized);
  $("peers").textContent = nf(s.peers); $("uptime").textContent = fmtUptime(s.uptime_secs);
}

function renderUpdate(u) {
  const bar = $("update-bar");
  if (!u || !u.available) { bar.hidden = true; updating = false; return; }
  bar.hidden = false;
  $("upd-title").textContent = t("upd_title", u.available);
  const progress = {downloading: "upd_downloading", verifying: "upd_verifying", launching: "upd_launching"}[u.progress];
  updating = !!progress;
  $("upd-btn").hidden = !!progress;
  const notes = u.notes && (u.notes[LANG] || u.notes.en);
  $("upd-text").textContent = progress ? t(progress) : (u.progress === "failed" && u.error) ? t("e_" + u.error) : (notes ? notes + " — " : "") + t("upd_required");
  if (u.progress === "failed") $("upd-btn").disabled = false;
}

function render(s) {
  lastStatus = s;
  renderUpdate(s.update);
  $("foot").textContent = `${t("version")} ${s.version}` + (s.update && s.update.error && !s.update.available ? ` · ${t("check_failed")}` : "");
  $("off").hidden = true;
  if (!s.account) {
    ["hero-card", "acc-view", "settings", "chart-card", "repair-card"].forEach(id => $(id).hidden = true);
    const onboarded = s.settings && s.settings.onboarded;
    $("welcome").hidden = !!onboarded; $("acc-form").hidden = !onboarded;
    if (!onboarded) renderWelcome();
    return;
  }
  $("welcome").hidden = true; $("acc-form").hidden = true;
  $("hero-card").hidden = false; $("acc-view").hidden = false; $("settings").hidden = false; $("chart-card").hidden = false;
  $("repair-card").hidden = s.state !== "needs_repair";
  renderCharts(s.history || []);
  $("saver").checked = !!(s.settings && s.settings.saver);
  $("help-net").checked = !!(s.settings && s.settings.help_network);
  renderHero(s);
  $("acc-name").textContent = s.account.name;
  $("acc-email").textContent = s.account.email;
  $("acc-reg").textContent = s.registration ? t("reg_" + s.registration.state) : "—";
  $("autostart").checked = !!(s.settings && s.settings.autostart);
}

async function refresh() {
  if (stopped) return;
  let s;
  try { s = await (await fetch("/api/status", {cache: "no-store"})).json(); }
  catch (e) { showOff(updating ? "updating_title" : "off_title", updating ? "updating_hint" : "off_hint"); return; }
  if (!built) { built = true; applyLang((s.settings && s.settings.lang) || "en"); }
  render(s);
}

applyLang("en");
post("/api/check-update").catch(() => {}).finally(() => setTimeout(refresh, 1500));
refresh(); setInterval(refresh, 5000);
</script>
