<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<title>MADAR Node&#8288;</title>
<style>
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --surface-2:#F0F3FA; --border:#E3E8F2; --ink:#0E1528; --mute:#5B6784;
  --brand-a:#0FB5A6; --brand-b:#2F5BEA; --accent:#FFC53D;
  --good:#16A34A; --warn:#D97706; --bad:#DC2626; --idle:#94A3B8;
  --shadow:0 1px 2px rgba(14,21,40,.05),0 8px 24px rgba(14,21,40,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B1020; --surface:#121935; --surface-2:#18213F; --border:#243052; --ink:#E7ECF7; --mute:#8D98B5;
  --good:#22C55E; --warn:#F5A524; --bad:#EF4444; --idle:#64748B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 48px}

/* header */
header{display:flex;align-items:center;gap:12px;margin:4px 0 22px}
header img{width:44px;height:44px;border-radius:50%;flex:none;box-shadow:0 0 18px rgba(29,78,216,.35)}
.brand{flex:1;min-width:0}
.brand h1{font-size:19px;margin:0;letter-spacing:.2px}
.brand p{margin:0;color:var(--mute);font-size:13px}
.lang{appearance:none;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:7px 30px 7px 12px;font:inherit;font-size:13px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}

/* update bar */
.update-bar{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#1d4fd8,#3d7bff);color:#fff;padding:12px 16px;box-shadow:var(--shadow)}
.update-bar .in{max-width:680px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.update-bar b{font-size:15px}
.update-bar .sub{opacity:.92;font-size:13px}
.update-bar button{background:#fff;color:#1d4fd8;border:0;font-weight:700}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:14px;margin:0 0 14px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.6px}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.ring{position:relative;width:148px;height:148px}
.ring svg{width:148px;height:148px;transform:rotate(-90deg)}
.ring .track{stroke:var(--surface-2)}
.ring .arc{stroke:var(--idle);transition:stroke-dashoffset .8s ease,stroke .3s}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.ring .small{font-size:12px;color:var(--mute)}
.ring .dot{width:14px;height:14px;border-radius:50%;background:var(--idle);box-shadow:0 0 0 6px color-mix(in srgb,var(--idle) 18%,transparent)}
.hero .state{font-size:22px;font-weight:700;margin:0 0 4px}
.hero .sentence{color:var(--mute);margin:0 0 10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px 10px}
.s-running{--c:var(--good)} .s-catching_up,.s-connecting,.s-starting,.s-bootstrapping{--c:var(--warn)} .s-disconnected,.s-stuck,.s-needs_repair{--c:var(--bad)} .s-stopped,.s-needs_account,.s-paused{--c:var(--idle)}
.hero .arc{stroke:var(--c)} .hero .dot{background:var(--c);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 20%,transparent)}
.s-running .dot{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 11px color-mix(in srgb,var(--c) 6%,transparent)}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat span{display:block;color:var(--mute);font-size:12px}
.stat b{font-size:18px;font-variant-numeric:tabular-nums}

/* forms */
label.fld{display:block;font-weight:600;margin:14px 0 6px;font-size:14px}
input[type=text],input[type=email],input[type=password]{width:100%;padding:11px 13px;font:inherit;border:1px solid var(--border);border-radius:11px;background:var(--surface-2);color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--brand-b);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-b) 20%,transparent)}
input[type=email]{direction:ltr}
.hint{color:var(--mute);font-size:13px;margin:6px 0 0}
.note{background:var(--surface-2);border-radius:12px;padding:10px 12px;margin-top:14px;font-size:13px;color:var(--mute)}
.note b{color:var(--ink)}
button{font:inherit;font-weight:600;padding:10px 18px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;transition:transform .05s,filter .2s}
button:active{transform:translateY(1px)}
button.primary{background:linear-gradient(135deg,var(--brand-a),var(--brand-b));border:0;color:#fff;margin-top:18px;width:100%;padding:12px}
.earn-big{font-size:34px;font-weight:700;margin:4px 0 10px}.earn-big span{font-size:15px;color:var(--mute);font-weight:600}
#earn-url{word-break:break-all;user-select:all}
button.primary:disabled{filter:grayscale(.6) opacity(.55);cursor:default}
button.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--border))}
.err{color:var(--bad);min-height:1.4em;margin-top:8px;font-size:13px}

dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0}
dt{color:var(--mute)} dd{margin:0;overflow-wrap:anywhere}
.lock{font-size:12px;color:var(--mute);font-weight:400;text-transform:none;letter-spacing:0}

.row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;transition:.2s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:20px;height:20px;top:2px;inset-inline-start:2px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch input:checked+span{background:linear-gradient(135deg,var(--brand-a),var(--brand-b));border-color:transparent}
.switch input:checked+span:before{transform:translateX(20px)}
.setting b{display:block} .setting small{color:var(--mute)}

footer{color:var(--mute);font-size:12px;text-align:center;margin-top:18px}
.eta{font-size:13px;color:var(--warn);font-weight:600;margin:-4px 0 10px}
.stats{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))!important}
.warns{margin-top:14px;display:grid;gap:8px}
.warn{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--border));border-radius:12px;padding:10px 12px;font-size:13px}
.stuck-help ul{margin:6px 0 8px;padding-inline-start:18px;display:grid;gap:4px}.stuck-help a{color:inherit;font-weight:700}
.warn:before{content:"!";flex:none;width:20px;height:20px;border-radius:50%;background:var(--warn);color:#fff;font-weight:700;display:grid;place-items:center;font-size:12px}
.repair{border-color:color-mix(in srgb,var(--bad) 45%,var(--border))}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chart{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.chart .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.chart .lbl b{color:var(--ink);font-size:14px}
.chart svg{width:100%;height:54px;display:block;margin-top:6px}
.welcome{text-align:center;padding:30px 26px}
.welcome img{width:84px;height:84px;border-radius:22px;margin:0 auto 14px;display:block;box-shadow:0 10px 30px color-mix(in srgb,var(--brand-b) 35%,transparent)}
.welcome h2{font-size:22px!important;color:var(--ink)!important;text-transform:none!important;letter-spacing:0!important;margin:0 0 8px!important}
.welcome p{color:var(--mute);max-width:440px;margin:0 auto 20px}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--border)} .dots i.on{background:var(--brand-b);width:22px;border-radius:4px}
.welcome .primary{max-width:260px}
@media (max-width:560px){.charts{grid-template-columns:1fr}}
[hidden]{display:none!important}
@media (max-width:560px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.stats{grid-template-columns:repeat(2,1fr)}
  header{flex-wrap:wrap}.brand{flex:1 1 calc(100% - 60px)}.lang{margin-inline-start:52px}}
</style>
</head>
<body>
<div class="update-bar" id="update-bar" role="alert" hidden>
  <div class="in">
    <div><b id="upd-title"></b><div class="sub" id="upd-text"></div></div>
    <button id="upd-btn" data-t="upd_btn"></button>
  </div>
</div>

<div class="wrap">
  <header>
    <img src="/logo.svg" alt="">
    <div class="brand"><h1 data-t="app_title"></h1><p data-t="tagline"></p></div>
    <select class="lang" id="lang" aria-label="Language">
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
      <option value="tr">Türkçe</option>
      <option value="id">Bahasa Indonesia</option>
    </select>
  </header>

  <!-- welcome (first run) -->
  <section class="card welcome" id="welcome" hidden>
    <img src="/logo.svg" alt="">
    <div class="dots" id="w-dots"><i></i><i></i><i></i></div>
    <h2 id="w-title"></h2>
    <p id="w-text"></p>
    <button class="primary" id="w-next"></button>
  </section>

  <!-- status -->
  <section class="card" id="hero-card" hidden>
    <div class="hero s-starting" id="hero">
      <div class="ring">
        <svg viewBox="0 0 160 160"><circle class="track" cx="80" cy="80" r="68" fill="none" stroke-width="12"/>
          <circle class="arc" id="arc" cx="80" cy="80" r="68" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="427.3" stroke-dashoffset="427.3"/></svg>
        <div class="center"><div class="big" id="ring-big"></div><div class="small" id="ring-small"></div><div class="dot" id="ring-dot" hidden></div></div>
      </div>
      <div>
        <p class="state" id="state"></p>
        <p class="sentence" id="sentence"></p>
        <p class="eta" id="eta" hidden></p>
        <span class="chip" id="role-chip" data-t="role"></span>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span data-t="stat_best"></span><b id="best">—</b></div>
      <div class="stat"><span data-t="stat_final"></span><b id="fin">—</b></div>
      <div class="stat"><span data-t="stat_peers"></span><b id="peers">—</b></div>
      <div class="stat"><span data-t="stat_uptime"></span><b id="uptime">—</b></div>
      <div class="stat"><span data-t="stat_verified"></span><b id="verified">—</b></div>
    </div>
    <div class="warns" id="warns"></div>
  </section>

  <section class="card repair" id="repair-card" hidden>
    <div class="row">
      <div class="setting"><b data-t="st_needs_repair"></b><small data-t="repair_hint"></small></div>
      <button class="danger" id="repair-btn" data-t="repair_btn"></button>
    </div>
  </section>

  <section class="card" id="chart-card" hidden>
    <h2 data-t="chart_title"></h2>
    <div class="charts">
      <div class="chart"><div class="lbl"><span data-t="chart_blocks"></span><b id="c-bpm">—</b></div><svg id="c-blocks" viewBox="0 0 200 54" preserveAspectRatio="none"></svg></div>
      <div class="chart"><div class="lbl"><span data-t="chart_peers"></span><b id="c-peers-now">—</b></div><svg id="c-peers" viewBox="0 0 200 54" preserveAspectRatio="none"></svg></div>
    </div>
    <p class="hint" id="chart-empty" data-t="chart_empty"></p>
  </section>

  <!-- "My earnings": link the node to a wallet, then its earnings -->
  <section class="card" id="earn-card" hidden>
    <h2 data-t="earn_title"></h2>
    <div id="earn-unlinked">
      <p class="sentence" data-t="earn_intro"></p>
      <p class="hint" id="earn-node-line" hidden><span data-t="earn_node"></span> <b id="earn-node" dir="ltr"></b></p>
      <button class="primary" id="earn-link" data-t="earn_link_btn"></button>
      <div id="earn-wait" hidden><p class="hint" data-t="earn_waiting"></p><p class="hint" data-t="earn_check"></p><p class="hint"><span data-t="earn_copy_hint"></span><br><code id="earn-url" dir="ltr"></code></p></div>
      <div class="err" id="earn-err"></div>
    </div>
    <div id="earn-linked" hidden>
      <div class="earn-big"><b id="earn-bal" dir="ltr"></b> <span data-t="earn_unit"></span></div>
      <dl>
        <dt data-t="earn_today"></dt><dd id="earn-today" dir="ltr"></dd>
        <dt data-t="earn_month"></dt><dd id="earn-month" dir="ltr"></dd>
        <dt data-t="earn_hours"></dt><dd id="earn-hours" dir="ltr"></dd>
        <dt data-t="earn_wallet"></dt><dd id="earn-wallet" dir="ltr"></dd>
      </dl>
      <p class="err" id="earn-off" hidden data-t="earn_not_connected"></p>
      <p class="hint" id="earn-gift" hidden data-t="earn_gift"></p>
      <p class="hint" id="earn-gift-wait" hidden data-t="earn_gift_wait"></p>
      <!-- the node campaign: X/7 days toward a free .madar name, then a button to the claim page -->
      <div id="earn-camp" hidden><p class="hint" id="earn-camp-text"></p><button class="primary" id="earn-camp-btn" hidden data-t="camp_btn"></button></div>
      <p class="hint" data-t="earn_kept"></p>
    </div>
  </section>

  <!-- "Enable voting" (2.0.14): the approved operator's node becomes a voting node; the app runs every step (no secret is ever shown here) -->
  <section class="card" id="vote-card" hidden>
    <h2 data-t="vote_title"></h2>
    <p class="sentence" id="vote-stage" hidden></p>
    <p class="hint" id="vote-intro" data-t="vote_intro"></p>
    <div id="vote-addr-box" hidden>
      <p class="hint" data-t="vote_address"></p>
      <p><code id="vote-addr" dir="ltr" style="word-break:break-all"></code></p>
      <button id="vote-copy" data-t="vote_copy"></button>
    </div>
    <div id="vote-send" hidden><p class="hint"><b data-t="vote_send"></b></p><p class="hint" data-t="vote_poll"></p></div>
    <p class="hint" id="vote-expiry" hidden></p>
    <div class="note"><b data-t="vote_stay"></b></div>
    <div class="err" id="vote-err"></div>
    <div class="row" style="margin-top:14px">
      <button class="primary" id="vote-on" data-t="vote_on_btn"></button>
      <button class="danger" id="vote-off" data-t="vote_off_btn" hidden></button>
      <button id="vote-recreate" data-t="vote_recreate_btn" hidden></button>
      <button id="vote-rekey" data-t="vote_rekey_btn" hidden></button>
    </div>
    <p class="hint" id="vote-recreate-hint" data-t="vote_recreate_hint" hidden></p>
    <p class="hint" id="vote-rekey-hint" data-t="vote_rekey_hint" hidden></p>
    <!-- opt-in encrypted backup / restore of the operator account: the passwords go only to the app, then to madar-node through a one-time pipe; the account secret is never shown -->
    <details id="vote-backup" hidden style="margin-top:14px">
      <summary data-t="vote_backup_title"></summary>
      <p class="hint" data-t="vote_backup_hint"></p>
      <p class="hint"><b data-t="vote_clone_warn"></b></p>
      <label class="fld" for="vote-bk-pass" data-t="vote_backup_pass"></label>
      <input id="vote-bk-pass" type="password" maxlength="256" autocomplete="new-password">
      <label class="fld" for="vote-bk-pass2" data-t="vote_backup_pass2"></label>
      <input id="vote-bk-pass2" type="password" maxlength="256" autocomplete="new-password">
      <div class="row" style="margin-top:10px"><button id="vote-bk-save" data-t="vote_backup_save"></button></div>
      <div class="err" id="vote-bk-err"></div>
      <p class="hint" id="vote-bk-done" data-t="vote_backup_done" hidden></p>
    </details>
    <details id="vote-restore" hidden style="margin-top:14px">
      <summary data-t="vote_restore_title"></summary>
      <p class="hint" data-t="vote_restore_hint"></p>
      <p class="hint"><b data-t="vote_clone_warn"></b></p>
      <label class="fld" for="vote-rs-file" data-t="vote_restore_file"></label>
      <input id="vote-rs-file" type="file" accept=".json,application/json">
      <label class="fld" for="vote-rs-pass" data-t="vote_restore_pass"></label>
      <input id="vote-rs-pass" type="password" maxlength="256" autocomplete="off">
      <div class="row" style="margin-top:10px"><button id="vote-rs-btn" data-t="vote_restore_btn"></button></div>
      <div class="err" id="vote-rs-err"></div>
    </details>
  </section>

  <!-- account: form, then locked view -->
  <section class="card" id="acc-form" hidden>
    <h2 data-t="account_title"></h2>
    <label class="fld" for="name" data-t="name_label"></label>
    <input id="name" type="text" maxlength="20" autocomplete="nickname">
    <p class="hint" data-t="name_hint"></p>
    <label class="fld" for="email" data-t="email_label"></label>
    <input id="email" type="email" maxlength="254" autocomplete="email" placeholder="name@example.com">
    <div class="note"><span data-t="privacy_note"></span><br><b data-t="lock_note"></b></div>
    <button class="primary" id="acc-btn" data-t="save_btn" disabled></button>
    <div class="err" id="acc-err"></div>
  </section>

  <section class="card" id="acc-view" hidden>
    <h2><span data-t="account_title"></span> <span class="lock">· <span data-t="locked"></span></span></h2>
    <dl>
      <dt data-t="name_label"></dt><dd id="acc-name"></dd>
      <dt data-t="email_label"></dt><dd id="acc-email" dir="ltr"></dd>
      <dt data-t="registry"></dt><dd id="acc-reg"></dd>
    </dl>
  </section>

  <section class="card" id="settings" hidden>
    <h2 data-t="settings_title"></h2>
    <div class="row">
      <div class="setting"><b data-t="autostart"></b><small data-t="autostart_hint"></small></div>
      <label class="switch"><input type="checkbox" id="autostart"><span></span></label>
    </div>
    <div class="row" style="margin-top:14px">
      <div class="setting"><b data-t="saver"></b><small data-t="saver_hint"></small></div>
      <label class="switch"><input type="checkbox" id="saver"><span></span></label>
    </div>
    <div class="row" style="margin-top:14px">
      <div class="setting"><b data-t="help_title"></b><small data-t="help_hint"></small></div>
      <label class="switch"><input type="checkbox" id="help-net"><span></span></label>
    </div>
    <div class="row" style="margin-top:14px">
      <div class="setting"><b data-t="report_title"></b><small data-t="report_hint"></small></div>
      <button id="report-btn" data-t="report_btn"></button>
    </div>
    <div class="row" style="margin-top:18px">
      <small class="hint" data-t="close_hint"></small>
      <button class="danger" id="stop-btn" data-t="stop_btn"></button>
    </div>
  </section>

  <section class="card" id="off" hidden>
    <div class="hero s-stopped">
      <div class="ring"><svg viewBox="0 0 160 160"><circle class="track" cx="80" cy="80" r="68" fill="none" stroke-width="12"/></svg>
        <div class="center"><div class="dot"></div></div></div>
      <div><p class="state" id="off-title"></p><p class="sentence" id="off-hint"></p></div>
    </div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const TOKEN = "{{TOKEN}}";
const $ = id => document.getElementById(id);

const I18N = {
en:{app_title:"MADAR Node",tagline:"A full node running quietly on this computer",account_title:"Your account",name_label:"Display name",name_hint:"3–20 characters: letters, numbers, spaces and hyphens.",email_label:"Email",privacy_note:"No password. Only your name, email and the last 8 characters of your node ID are sent to the MADAR registry.",lock_note:"Your name and email cannot be changed after saving.",save_btn:"Save and start",confirm_save:"Save your name and email? They cannot be changed later.",locked:"locked",registry:"Registry",role:"Full node · does not vote",settings_title:"Settings",autostart:"Start with Windows",autostart_hint:"Starts quietly in the background when you sign in.",stop_btn:"Stop node",confirm_stop:"Stop the MADAR node? Your data is kept.",close_hint:"You can close this page — the node keeps running in the background.",stat_best:"Best block",stat_final:"Finalized",stat_peers:"Peers",stat_uptime:"Running for",synced:"synced",

Object.assign(I18N.tr, {vs_stuck:"Bir oylama adımı art arda birkaç kez başarısız oldu. Uygulama daha uzun aralıklarla denemeye devam ediyor. Bu sürerse bir sorun raporu gönderin.",vs_account_broken:"Bu bilgisayardaki operatör hesabı kullanılamıyor: eksik ya da başka bir Windows hesabıyla veya başka bir bilgisayarda oluşturulmuş. Oylama bu hesapla devam edemez.",vs_rpc_not_ours:"Düğümün yerel bağlantı noktasında başka bir program yanıt veriyor; bu nedenle uygulama güvenliğiniz için oylama adımlarını durdurdu. Bilgisayarı yeniden başlatın, ardından MADAR'ı yeniden açın.",vote_recreate_btn:"Operatör hesabını yeniden oluştur",vote_recreate_hint:"Hesap ağda henüz hiçbir şey başlatmadığı için bu mümkün.",vote_confirm_recreate:"Uygulama kullanılamayan hesabın dosyalarını bir kenara ayıracak ve yeni adresli yeni bir operatör hesabı oluşturacak. Ardından yeni adresi onay için bize gönderin. Devam edilsin mi?",e_not_allowed:"Bu işlem şu anda kullanılamıyor."});

Object.assign(I18N.en, {vs_state_lost:"The saved voting state on this computer was lost. Choose whether voting should continue on this computer; until then the app takes no voting step.",vs_cannot_verify:"The app cannot confirm that the voting keys on this computer belong to it (the protected marker cannot be read here). The node keeps running as a full node and nothing was changed. If this computer should vote, register new voting keys for it.",vs_rpc_not_ours:"Another program keeps answering on the node's local ports, so the app stopped the voting steps for your safety. Restart the computer, then open MADAR again.",vote_rekey_btn:"Register new voting keys for this computer",vote_rekey_hint:"The old key files are only renamed and kept; nothing is deleted.",vote_confirm_rekey:"The app will register new voting keys for this computer (old key files are renamed and kept, not deleted). If another computer votes with this account, stop voting there first: the network keeps using the old keys until the next session change, and two computers must never vote for one account. Continue?",vote_backup_title:"Save an encrypted backup",vote_backup_hint:"Protects the operator account with a password you choose, so you can restore it on another computer. Without this password the file cannot be opened, and nobody can recover it for you.",vote_backup_pass:"Backup password (at least 12 characters)",vote_backup_pass2:"Repeat the password",vote_backup_save:"Save the backup file",vote_backup_done:"The encrypted backup file was saved. Keep it and its password in two separate places.",vote_restore_title:"Restore the account",vote_restore_hint:"Restore an operator account from an encrypted backup file. The app then registers new voting keys for this computer.",vote_restore_file:"Backup file",vote_restore_pass:"Backup password",vote_restore_btn:"Restore the account",vote_confirm_restore:"Restore the operator account from this file on this computer and enable voting here? If another computer votes with this account, stop voting there first: two computers must never vote for one account.",vote_restore_done:"The account was restored. The app continues the voting steps by itself.",ve_keys_mismatch:"The voting keys registered on the network are not in this computer's key files.",vs_keys_other_device:"The voting keys registered on the network for this account were not registered by this computer: another computer seems to vote with this account. This node stays a full node. If this computer should vote instead, stop voting on the other computer, then register new voting keys for this one.",vote_clone_warn:"Never run a copy of this voting computer (a virtual machine or a disk clone) or a second copy of the app with the same data at the same time as this one: two copies signing with the same keys is double signing, which the network punishes.",ve_job_failed:"Windows did not let the app tie the node to itself, so the node will not vote in this session. Restart the computer, then open MADAR again.",e_password_short:"The password must be at least 12 characters.",e_password_bad:"The password must not contain line breaks and must be at most 256 characters.",e_password_mismatch:"The two passwords do not match.",e_backup_failed:"The backup could not be made. Try again.",e_restore_failed:"The account could not be restored. Check the file and its password.",e_not_a_backup:"This is not a MADAR operator account backup file.",e_account_exists:"An operator account already exists on this computer.",e_no_operator_account:"There is no operator account on this computer yet.",e_unseal_failed:"The operator account cannot be opened under this Windows account.",e_no_file:"Choose the backup file first."});
Object.assign(I18N.fr, {vs_state_lost:"L'état de vote enregistré sur cet ordinateur a été perdu. Choisissez si le vote doit continuer sur cet ordinateur ; d'ici là, l'application n'effectue aucune étape du vote.",vs_cannot_verify:"L'application ne peut pas confirmer que les clés de vote de cet ordinateur lui appartiennent (le marqueur protégé ne peut pas être lu ici). Le nœud continue comme nœud complet et rien n'a été modifié. Si cet ordinateur doit voter, enregistrez-lui de nouvelles clés de vote.",vs_rpc_not_ours:"Un autre programme continue de répondre sur les ports locaux du nœud ; l'application a donc arrêté les étapes du vote pour votre sécurité. Redémarrez l'ordinateur, puis rouvrez MADAR.",vote_rekey_btn:"Enregistrer de nouvelles clés de vote pour cet ordinateur",vote_rekey_hint:"Les anciens fichiers de clés sont seulement renommés et conservés ; rien n'est supprimé.",vote_confirm_rekey:"L'application va enregistrer de nouvelles clés de vote pour cet ordinateur (les anciens fichiers de clés sont renommés et conservés, non supprimés). Si un autre ordinateur vote avec ce compte, arrêtez d'abord le vote sur celui-ci : le réseau continue d'utiliser les anciennes clés jusqu'au prochain changement de session, et deux ordinateurs ne doivent jamais voter pour un même compte. Continuer ?",vote_backup_title:"Enregistrer une sauvegarde chiffrée",vote_backup_hint:"Protège le compte d'opérateur par un mot de passe que vous choisissez, pour pouvoir le restaurer sur un autre ordinateur. Sans ce mot de passe, le fichier ne peut pas être ouvert et personne ne peut le récupérer pour vous.",vote_backup_pass:"Mot de passe de la sauvegarde (12 caractères au moins)",vote_backup_pass2:"Répétez le mot de passe",vote_backup_save:"Enregistrer le fichier de sauvegarde",vote_backup_done:"Le fichier de sauvegarde chiffré a été enregistré. Conservez-le, ainsi que son mot de passe, à deux endroits distincts.",vote_restore_title:"Restaurer le compte",vote_restore_hint:"Restaurez un compte let LANG = "en", stopped = false, updating = false, built = false, lastStatus = null;

const t = (k, v) => ((I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k).replace("{v}", v ?? "");
// unknown error codes fall back to the general message (never a raw code on screen)
const ek = c => I18N.en["e_" + c] ? "e_" + c : "e_generic", te = c => t(ek(c));
const nf = n => n == null ? "—" : new Intl.NumberFormat(LANG).format(n);

function applyLang(lang) {
  LANG = I18N[lang] ? lang : "en";
  document.documentElement.lang = LANG;
  document.documentElement.dir = "ltr";
  $("lang").value = LANG;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.title = t("app_title") + "\u2060"; // invisible mark: the app finds its open window by it
  if (lastStatus) render(lastStatus);
}

async function post(path, body) {
  const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json", "X-Madar-Token": TOKEN}, body: JSON.stringify(body || {})});
  let j = {}; try { j = await r.json(); } catch (e) {}
  return {ok: r.ok, j};
}

$("lang").addEventListener("change", async e => { applyLang(e.target.value); try { await post("/api/settings", {lang: LANG}); } catch (_) {} });
$("autostart").addEventListener("change", async e => {
  const {ok, j} = await post("/api/settings", {autostart: e.target.checked});
  if (!ok) { e.target.checked = !e.target.checked; alert(te(j.error)); }
});

function validate() {
  const n = $("name").value.trim().length, em = $("email").value.trim();
  $("acc-btn").disabled = !(n >= 3 && n <= 20 && /^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/.test(em));
}
$("name").addEventListener("input", validate);
$("email").addEventListener("input", validate);
$("acc-btn").addEventListener("click", async () => {
  if (!confirm(t("confirm_save"))) return;
  $("acc-btn").disabled = true; $("acc-err").textContent = "";
  const {ok, j} = await post("/api/account", {name: $("name").value, email: $("email").value});
  if (!ok) { $("acc-err").textContent = te(j.error); validate(); return; }
  refresh();
});
$("stop-btn").addEventListener("click", async () => {
  if (!confirm(t("confirm_stop"))) return;
  $("stop-btn").disabled = true;
  try { await post("/api/stop"); } catch (e) {}
  stopped = true; showOff("off_title", "off_hint");
});
$("upd-btn").addEventListener("click", async () => {
  $("upd-btn").disabled = true;
  const {ok, j} = await post("/api/update");
  if (!ok) { $("upd-text").textContent = te(j.error); $("upd-btn").disabled = false; }
});

// "My earnings"
let earnBusy = false;
async function renderEarn() {
  let r;
  try { r = await post("/api/rewards"); } catch (e) { return; }
  if (!r.ok) return;
  const v = r.j, me = v.me || {};
  const linked = !!v.linked;
  $("earn-card").hidden = !(v.open || linked);
  if (!(v.open || linked)) return;
  $("earn-unlinked").hidden = linked; $("earn-linked").hidden = !linked;
  if (linked) {
    $("earn-bal").textContent = me.balance || "0";
    $("earn-today").textContent = (me.today || "0") + " " + t("earn_unit");
    $("earn-month").textContent = (me.month || "0") + " " + t("earn_unit");
    $("earn-hours").textContent = String(me.hours || 0);
    $("earn-wallet").textContent = me.wallet || "—";
    $("earn-gift").hidden = !(me.gift && me.gift !== "0");
    $("earn-gift-wait").hidden = !me.gift_pending;
    $("earn-off").hidden = !v.not_connected;
    // the campaign (from the service's «me»): only numbers from it, shown with textContent
    const c = me.campaign;
    $("earn-camp").hidden = !c;
    if (c) {
      const days = Math.min(Number(c.days_done) || 0, 7), founder = Number.isSafeInteger(c.founder) ? " · " + t("camp_founder", String(c.founder)) : "";
      $("earn-camp-text").textContent = (c.claimed ? t("camp_claimed", String(c.name || "")) : c.eligible ? t("camp_ready") : t("camp_days", days + "/7")) + founder;
      $("earn-camp-btn").hidden = !(c.eligible && !c.claimed);
    }
  } else {
    $("earn-node-line").hidden = !v.node; $("earn-node").textContent = v.node || "";
    $("earn-wait").hidden = !v.waiting;
    if (v.waiting && v.link) $("earn-url").textContent = v.link;
    $("earn-link").disabled = earnBusy;
  }
}
$("earn-link").addEventListener("click", async () => {
  earnBusy = true; $("earn-link").disabled = true; $("earn-err").textContent = "";
  const {ok, j} = await post("/api/rewards/link");
  earnBusy = false;
  if (!ok) { $("earn-err").textContent = te(j.error || "service"); $("earn-link").disabled = false; return; }
  $("earn-url").textContent = j.link || ""; $("earn-wait").hidden = false;
});

// opens the campaign page (a fixed address) in the user's own browser, where Madar Wallet is
$("earn-camp-btn").addEventListener("click", async () => { try { await post("/api/rewards/campaign"); } catch (_) {} });

// "Enable voting": the page only shows the stage and the public address; the app runs every step
function renderVote(s) {
  const v = s.vote || {}, st = v.stage || "off", wanted = !!v.wanted;
  $("vote-card").hidden = false;
  const showStage = st !== "off";
  $("vote-stage").hidden = !showStage;
  if (showStage) $("vote-stage").textContent = t("vs_" + st);
  $("vote-intro").hidden = wanted;
  $("vote-addr-box").hidden = !v.address;
  if ($("vote-addr").textContent !== (v.address || "")) $("vote-addr").textContent = v.address || "";
  $("vote-send").hidden = !(wanted && v.address && (st === "awaiting_approval" || st === "needs_newer_node"));
  const showExp = (st === "voting" || st === "renewing") && v.expiry_session != null;
  $("vote-expiry").hidden = !showExp;
  if (showExp) $("vote-expiry").textContent = t("vote_expiry", nf(v.expiry_session));
  // a specific message for some errors (ve_<code>), else the general one
  const ek = v.error ? "ve_" + v.error : "";
  $("vote-err").textContent = v.error && !voteBusy ? t(I18N.en[ek] ? ek : "vote_err") : "";
  // the saved state was lost: the user chooses again (both buttons), the app takes no step until then
  const lost = st === "state_lost";
  $("vote-on").hidden = wanted && !lost; $("vote-off").hidden = !wanted && !lost;
  // "Recreate the operator account": only for an unusable account that has not started anything on the network (the app checks again)
  const canRecreate = wanted && st === "account_broken" && v.can_recreate === true;
  $("vote-recreate").hidden = !canRecreate; $("vote-recreate-hint").hidden = !canRecreate;
  // "Register new keys for this computer": only when the app cannot verify the keys here (old files are renamed, never deleted)
  // also when the network names keys this computer never registered (another computer votes): the user may take over
  const canRekey = st === "cannot_verify" || st === "keys_other_device";
  $("vote-rekey").hidden = !canRekey; $("vote-rekey-hint").hidden = !canRekey;
  // backup: an account exists and opens; restore: no operator account file at all on this computer
  $("vote-backup").hidden = !(v.address && st !== "account_broken");
  $("vote-restore").hidden = !(s.account && v.has_account_files === false);
  $("role-chip").textContent = t(v.mode === "validator" ? "role_voting" : "role");
}
let voteBusy = false;
async function voteSet(path, ask) {
  if (voteBusy || !confirm(t(ask))) return;
  voteBusy = true;
  try {
    const {ok, j} = await post(path);
    if (!ok) $("vote-err").textContent = te(j.error);
  } catch (_) {}
  voteBusy = false; refresh();
}
$("vote-on").addEventListener("click", () => voteSet("/api/vote/enable", "vote_confirm_on"));
$("vote-off").addEventListener("click", () => voteSet("/api/vote/disable", "vote_confirm_off"));

$("vote-rekey").addEventListener("click", () => voteSet("/api/vote/rekey", "vote_confirm_rekey"));

  $("vote-bk-pass").value = ""; $("vote-bk-pass2").value = "";
  $("vote-bk-err").textContent = ""; $("vote-bk-done").hidden = true;
  if ([...a].length < 12) return err("e_password_short");
  if (a !== b) return err("e_password_mismatch");
  $("vote-bk-save").disabled = true;
  try {
    const {ok, j} = await post("/api/vote/backup", {password: a, confirm: b});
    if (!ok) err(ek(j.error || "backup_failed"));
    else {
      const url = URL.createObjectURL(new Blob([j.file], {type: "application/json"}));
      const el = document.createElement("a");
      el.href = url; el.download = j.name || "madar-operator-backup.json";
      document.body.appendChild(el); el.click(); el.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      $("vote-bk-done").hidden = false;
    }
  } catch (_) { err("e_backup_failed"); }
  $("vote-bk-save").disabled = false;
});
// "Restore the account": on a computer without an operator account; new voting keys are then registered for this computer
$("vote-rs-btn").addEventListener("click", async () => {
  const f = $("vote-rs-file").files[0], pw = $("vote-rs-pass").value, err = k => $("vote-rs-err").textContent = t(k);
  // the password never stays in the page after any result
  $("vote-rs-pass").value = "";
  $("vote-rs-err").textContent = "";
  if (!f) return err("e_no_file");

  if (!confirm(t("vote_confirm_restore"))) return;
  voteBusy = true; $("vote-rs-btn").disabled = true;

$("vote-copy").addEventListener("click", async () => {
  const text = $("vote-addr").textContent;

  $("vote-copy").textContent = t("vote_copied");

function showOff(title, hint) {
  ["hero-card", "acc-form", "acc-view", "settings", "earn-card"].forEach(s => $(s).hidden = true);
  $("off").hidden = false; $("off-title").textContent = t(title); $("off-hint").textContent = t(hint);
}

// ===== welcome (first run) =====
let wStep = 0;
function renderWelcome() {
  const n = wStep + 1;
  $("w-title").textContent = t("w" + n + "_title");
  $("w-text").textContent = t("w" + n + "_text");
  $("w-next").textContent = n < 3 ? t("next") : t("get_started");
  [...$("w-dots").children].forEach((d, i) => d.classList.toggle("on", i === wStep));

// ===== ETA from recent progress =====
const syncSamples = [];
function estimateEta(sync) {
  const now = Date.now();
  syncSamples.push([now, sync.current]);
  while (syncSamples.length > 2 && now - syncSamples[0][0] > 60000) syncSamples.shift();
  if (syncSamples.length < 2) return null;
  const [t0, c0] = syncSamples[0];
  const rate = (sync.current - c0) / ((now - t0) / 1000);
  const left = sync.highest - sync.current;
  return rate > 0 && left > 0 ? left / rate : null;
}

// ===== sparklines (last hour, samples every 30 s from the app) =====
function sparkline(svg, values, color) {
  if (values.length < 2) { svg.replaceChildren(); return; }
  const max = Math.max(1, ...values), W = 200, H = 54, pad = 3;
  const pts = values.map((v, i) => [i * (W / (values.length - 1)), H - pad - (v / max) * (H - 2 * pad)]);
  const line = pts.map(([x, y], i) => (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1)).join(" ");
  const ns = "http://www.w3.org/2000/svg";
  const area = document.createElementNS(ns, "path");
  area.setAttribute("d", line + ` L${W} ${H} L0 ${H} Z`); area.setAttribute("fill", color); area.setAttribute("fill-opacity", ".12");
  const path = document.createElementNS(ns, "path");
  path.setAttribute("d", line); path.setAttribute("fill", "none"); path.setAttribute("stroke", color);
  path.setAttribute("stroke-width", "2"); path.setAttribute("vector-effect", "non-scaling-stroke"); path.setAttribute("stroke-linejoin", "round");
  svg.replaceChildren(area, path);
}
function renderCharts(hist) {
  const bpm = [];
  for (let i = 1; i < hist.length; i++) {
    const dt = (hist[i][0] - hist[i - 1][0]) / 60;
    bpm.push(dt > 0 ? Math.max(0, (hist[i][1] - hist[i - 1][1]) / dt) : 0);
  }
  const peers = hist.map(h => h[2]);
  const css = getComputedStyle(document.documentElement);
  sparkline($("c-blocks"), bpm, css.getPropertyValue("--brand-a").trim() || "#0FB5A6");
  sparkline($("c-peers"), peers, css.getPropertyValue("--brand-b").trim() || "#2F5BEA");
  $("c-bpm").textContent = bpm.length ? nf(Math.round(bpm[bpm.length - 1])) : "—";
  $("c-peers-now").textContent = peers.length ? nf(peers[peers.length - 1]) : "—";
  $("chart-empty").hidden = hist.length >= 2;
}

function fmtUptime(s) {
  if (s == null) return "—";
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${nf(d)}${t("u_d")} ${nf(h)}${t("u_h")}` : h ? `${nf(h)}${t("u_h")} ${nf(m)}${t("u_m")}` : `${nf(m)}${t("u_m")}`;
}

const ARC = 427.3;
function renderHero(s) {
  const hero = $("hero");
  hero.className = "hero s-" + s.state;
  $("state").textContent = t("st_" + s.state);
  const sentenceKey = s.state === "paused" ? "se_paused_" + (s.paused || "battery")
    : s.state === "bootstrapping" ? "se_bootstrap_" + (s.bootstrap || "downloading") : "se_" + s.state;
  $("sentence").textContent = t(sentenceKey);
  // Time remaining: from the block progress rate over the last minute (computed in the page).
  const eta = s.state === "catching_up" && s.sync ? estimateEta(s.sync) : null;
  $("eta").hidden = eta == null;
  if (eta != null) $("eta").textContent = t("eta", eta < 60 ? `${nf(Math.max(1, Math.round(eta)))} ${t("u_sec")}` : `${nf(Math.ceil(eta / 60))} ${t("u_min")}`);
  $("verified").textContent = nf(s.blocks_verified);
  const warns = [];
  const h = s.health || {};
  if (h.disk_low) warns.push(t("warn_disk", nf(h.disk_free_gb)));
  if (h.clock_bad) warns.push(t("warn_clock", nf(Math.round(Math.abs(h.clock_offset_s)))));
  const nodes = warns.map(w => { const d = document.createElement("div"); d.className = "warn"; d.textContent = w; return d; });
  // Stuck: likely causes + support email (email only).
  if (s.state === "stuck") {
    const d = document.createElement("div"); d.className = "warn stuck-help";
    const box = document.createElement("div");
    const ul = document.createElement("ul");
    ["stuck_net", "stuck_clock", "stuck_ver"].forEach(k => { const li = document.createElement("li"); li.textContent = t(k); ul.appendChild(li); });
    const mail = document.createElement("div"); mail.textContent = t("stuck_mail") + " ";
    const a = document.createElement("a"); a.href = "mailto:contact@madar-network.com?subject=" + encodeURIComponent("MADAR node stuck (" + s.version + ")"); a.textContent = "contact@madar-network.com";
    mail.appendChild(a); box.append(ul, mail); d.appendChild(box); nodes.push(d);
  }
  $("warns").replaceChildren(...nodes);
  const pct = s.sync ? Math.min(100, Math.max(0, s.sync.percent)) : null;
  let frac = 0, big = "", small = "", dot = false;
  if (s.state === "running") { frac = 1; big = "✓"; small = t("synced"); }
  else if (s.state === "catching_up" && pct != null) { frac = pct / 100; big = nf(Math.floor(pct)) + "%"; small = t("synced"); }
  else if (s.state === "connecting" || s.state === "starting" || s.state === "bootstrapping") { frac = .15; dot = true; }
  else if (s.state === "disconnected" || s.state === "stuck") { frac = pct != null ? pct / 100 : 1; dot = true; }
  else { dot = true; }
  $("arc").style.strokeDashoffset = String(ARC * (1 - frac));
  $("ring-big").textContent = big; $("ring-small").textContent = small;
  $("ring-dot").hidden = !dot; $("ring-big").hidden = dot; $("ring-small").hidden = dot;
  $("best").textContent = nf(s.best); $("fin").textContent = nf(s.finalized);
  $("peers").textContent = nf(s.peers); $("uptime").textContent = fmtUptime(s.uptime_secs);
}

function renderUpdate(u) {
  const bar = $("update-bar");
  if (!u || !u.available) { bar.hidden = true; updating = false; return; }
  bar.hidden = false;
  $("upd-title").textContent = t("upd_title", u.available);
  const progress = {downloading: "upd_downloading", verifying: "upd_verifying", launching: "upd_launching"}[u.progress];
  updating = !!progress;
  $("upd-btn").hidden = !!progress;
  const notes = u.notes && (u.notes[LANG] || u.notes.en);
  $("upd-text").textContent = progress ? t(progress) : (u.progress === "failed" && u.error) ? te(u.error) : (notes ? notes + " — " : "") + t("upd_required");
  if (u.progress === "failed") $("upd-btn").disabled = false;
}

function render(s) {
  lastStatus = s;
  renderUpdate(s.update);
  $("foot").textContent = `${t("version")} ${s.version}` + (s.update && s.update.error && !s.update.available ? ` · ${t("check_failed")}` : "");
  $("off").hidden = true;
  if (!s.account) {
    ["hero-card", "acc-view", "settings", "chart-card", "repair-card", "earn-card", "vote-card"].forEach(id => $(id).hidden = true);
    const onboarded = s.settings && s.settings.onboarded;
    $("welcome").hidden = !!onboarded; $("acc-form").hidden = !onboarded;
    if (!onboarded) renderWelcome();
    return;
  }
  $("welcome").hidden = true; $("acc-form").hidden = true;
  $("hero-card").hidden = false; $("acc-view").hidden = false; $("settings").hidden = false; $("chart-card").hidden = false;
  renderEarn(); // shown only when "My earnings" is open on the service, or the node is already linked
  renderVote(s);
  $("repair-card").hidden = s.state !== "needs_repair";
  renderCharts(s.history || []);
  $("saver").checked = !!(s.settings && s.settings.saver);
  $("help-net").checked = !!(s.settings && s.settings.help_network);
  renderHero(s);
  $("acc-name").textContent = s.account.name;
  $("acc-email").textContent = s.account.email;
  $("acc-reg").textContent = s.registration ? t("reg_" + s.registration.state) : "—";
  $("autostart").checked = !!(s.settings && s.settings.autostart);
}

async function refresh() {
  if (stopped) return;
  let s;
  try { s = await (await fetch("/api/status", {cache: "no-store"})).json(); }
  catch (e) { showOff(updating ? "updating_title" : "off_title", updating ? "updating_hint" : "off_hint"); return; }
  if (!built) { built = true; applyLang((s.settings && s.settings.lang) || "en"); }
  render(s);
}

applyLang("en");
post("/api/check-update").catch(() => {}).finally(() => setTimeout(refresh, 1500));
refresh(); setInterval(refresh, 5000);
