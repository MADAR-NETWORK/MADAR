[package]
name = "madar-update"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "MADAR Network — signed release-manifest verification and opt-in update check (Phase 10, §14/D32). No network I/O, no production keys, no forced updates."
license = "Apache-2.0"
publish = false

[dependencies]
ed25519-dalek = "2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "deny"
