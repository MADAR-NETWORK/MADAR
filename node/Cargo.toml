[package]
name = "madar-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "MADAR Network — the executable node endpoint: BABE+GRANDPA, P2P and RPC wired as-is (§6/§11), no fees (D17), no benchmarking CLI yet (no measured weights)."
# The license of this file (MADAR's own code) only — Apache-2.0, unchanged. The `sc-*`
# dependencies below are licensed GPL-3.0-or-later WITH Classpath-exception-2.0 by
# `polkadot-sdk` itself; see docs/security/node-licensing.md and NOTICE
# for the full explanation (this does not change the license of this file).
license = "Apache-2.0"
publish = false
build = "build.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
futures = { version = "0.3.34", features = ["thread-pool"] }
async-trait = "0.1"
log = "0.4"
jsonrpsee = { version = "0.24", features = ["server"] }

madar-consensus = { path = "../consensus" }
madar-protocol = { path = "../protocol" }
madar-update = { path = "../update" }
madar-admission-api = { path = "../admission-api" }
madar-transactions = { path = "../transactions" }
madar-keystore = { path = "../keystore" }
madar-upgrade-authority = { path = "../upgrade-authority" }
parity-scale-codec = { version = "3.6.12", features = ["derive"] }
rpassword = "7"
zeroize = "1"
sysinfo = "0.32"
hex = "0.4"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

sc-basic-authorship = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sc-cli = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sc-client-api = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sc-consensus = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sc-consensus-babe = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sc-consensus-grandpa = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sc-consensus-slots = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sc-executor = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sc-executor-common = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sc-network = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sc-offchain = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sc-service = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sc-telemetry = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sc-transaction-pool = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sc-transaction-pool-api = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }

sp-api = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sp-block-builder = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sp-blockchain = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sp-consensus-babe = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sp-consensus = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sp-core = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sp-genesis-builder = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sp-inherents = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sp-io = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sp-crypto-hashing = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sp-keyring = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sp-timestamp = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
sp-version = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }

frame-support = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
frame-system = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
pallet-collective = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
pallet-grandpa = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }
substrate-frame-rpc-system = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }

# Benchmarks only (feature `runtime-benchmarks`, off by default): `madar-node benchmark pallet|overhead|storage|machine`.
frame-benchmarking = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", optional = true }
frame-benchmarking-cli = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2", optional = true }

# Unix: RocksDB lock check (`fcntl`) before `join gen-keys` (the node must be stopped). Already in the dependency tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Android (the mobile node app): OpenSSL is built with the program itself (there is no system library on Android). Does not affect Windows/Linux/macOS.
[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[build-dependencies]
substrate-build-script-utils = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2606-2" }

[lints.rust]
unsafe_code = "deny"

[features]
fast-test-runtime = ["madar-consensus/fast-test-runtime"]
## Benchmarks only: adds the `benchmark` subcommand and builds the runtime with its benchmark API. Never for production.
runtime-benchmarks = [
    "madar-consensus/runtime-benchmarks",
    "dep:frame-benchmarking",
    "dep:frame-benchmarking-cli",
    "frame-benchmarking/runtime-benchmarks",
    "frame-benchmarking-cli/runtime-benchmarks",
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "sc-service/runtime-benchmarks",
    "sp-runtime/runtime-benchmarks",
]
