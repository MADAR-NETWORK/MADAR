[package]
name = "madar-ops"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Madar Ops — watches Substrate / Polkadot SDK nodes and alerts the operator (phone, Telegram, webhook). Runs next to the node; nothing leaves the machine except the alert text."
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
sysinfo = "0.32"

[lints.rust]
unsafe_code = "deny"
