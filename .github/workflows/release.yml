# Release-candidate build: runs on a `v*` tag (or manually). **It publishes nothing, signs nothing and uses no key**: it produces artifacts + SHA256SUMS + SBOM + build manifest +
# a provenance attestation; the owner then verifies with scripts/verify-release.sh and signs manually with the D35 keys (air-gapped). The gates themselves (ci.yml) are a precondition.
name: release-candidate
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions: {}

jobs:
  gates:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: build ${{ matrix.slot }}
    needs: gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        slot: [a, b]   # two independent builds (two separate VMs, same image) — they do not prove cross-OS reproducibility (see the internal design document)
    permissions:
      contents: read
      id-token: write       # provenance only
      attestations: write   # provenance only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libclang-dev clang libssl-dev pkg-config
      - run: rustup show active-toolchain
      - run: cargo install --locked cargo-cyclonedx@0.5.9
      - name: build candidate (same script as local)
        run: bash scripts/build-release.sh --out dist
      - name: provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/madar-node
            dist/madar_consensus.wasm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.slot }}
          path: dist/
          if-no-files-found: error

  compare:
    name: compare the two independent builds
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: builds
      - run: bash scripts/compare-builds.sh builds/dist-a builds/dist-b | tee -a "$GITHUB_STEP_SUMMARY"
