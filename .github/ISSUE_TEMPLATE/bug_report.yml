name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        **Security vulnerabilities must not be reported here** — see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the problem, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `madar-node ...`
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `madar-node --version`, or the git commit you built from.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Node (madar-node)
        - Runtime / consensus
        - Admission / join
        - Madar Stamp
        - Desktop app (Windows)
        - Installer
        - Build / CI / scripts
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 24.04 x86-64
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste log output here. Remove anything private first. Never paste keys, seed phrases or passwords.
      render: shell
