[package]
name = "madar-keystore"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "MADAR Network — local user-key encrypted backup/restore + zeroization (Phase 9, §9). No node/validator keys here (those stay in unmodified sc-keystore per IDN-2)."
license = "Apache-2.0"
publish = false

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "deny"
